apiVersion: apps/v1
kind: Deployment
metadata:
  name: pythontest
  labels:
    app: pythontest
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pythontest
  template:
    metadata:
      labels:
        app: pythontest
    spec:
      containers:
      - name: pythontest
        image: 192.168.49.1:4000/pythontest:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 5000